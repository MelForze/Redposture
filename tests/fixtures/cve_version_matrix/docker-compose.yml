services:
  redis-vulnerable:
    image: redis:7.0.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16370:6379"

  redis-fixed:
    image: redis:7.0.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16371:6379"

  redis-next-fixed:
    image: redis:7.0.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16374:6379"

  grafana-vulnerable:
    image: grafana/grafana:11.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:13000:3000"

  grafana-fixed:
    image: grafana/grafana:11.0.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:13005:3000"

  grafana-next-vulnerable:
    image: grafana/grafana:11.1.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:13115:3000"

  grafana-next-fixed:
    image: grafana/grafana:11.1.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:13116:3000"

  postgres-vulnerable:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_PASSWORD: matrixpass
    ports:
      - "127.0.0.1:16372:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 90

  postgres-fixed:
    image: postgres:16.5-alpine
    environment:
      POSTGRES_PASSWORD: matrixpass
    ports:
      - "127.0.0.1:16373:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 90
