services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: redposture-airflow-sso-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"realm\":\"master\"' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  airflow-gateway:
    image: python:3.12-alpine
    container_name: redposture-airflow-sso-gateway
    command: ["python", "/app/gateway.py"]
    environment:
      KEYCLOAK_PUBLIC_URL: http://127.0.0.1:18080
    volumes:
      - ./gateway.py:/app/gateway.py:ro
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/version', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
