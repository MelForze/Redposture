# Same API, independent gateways: self-account endpoint, no Admin API, prefix
# redirect (SigV4 must be re-signed), and a gateway blocking every verifier.
server {
    listen 8080;
    location = / {
        if ($http_authorization != "") { return 502 "signed root blocked by gateway"; }
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
    location = /minio/admin/v3/accountinfo {
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
    location /minio/admin/ { return 404 "Admin API blocked by gateway"; }
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
}
server {
    listen 8081;
    location = / {
        if ($http_authorization != "") { return 502 "signed root blocked by gateway"; }
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
    location /minio/admin/ { return 404 "Admin API blocked by gateway"; }
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
}
server {
    listen 8082;
    absolute_redirect off;
    location ~ ^/edge/storage/(.*)$ { return 307 /$1$is_args$args; }
    location = / {
        if ($http_authorization != "") { return 502 "signed root blocked by gateway"; }
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
    location /minio/admin/ { return 404 "Admin API blocked by gateway"; }
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
}
server {
    listen 8083;
    location = / {
        if ($http_authorization != "") { return 502 "signed root blocked by gateway"; }
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
    location /minio/health/ {
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
    location / { return 403 "verifier blocked by gateway"; }
}
