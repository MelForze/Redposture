[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "redposture"
version = "4.0.11"
description = "Security toolkit for listener emulation, endpoint discovery/trigger/collect, and Redis/Postgres/ClickHouse/etcd/Registry/Grafana/GitLab/Kafka/ZooKeeper/Elasticsearch auditing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "RedPosture contributors" },
]
keywords = ["security", "cli", "redteam", "observability", "prometheus", "recon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = [
  "clickhouse-connect>=0.8.0",
  "clickhouse-driver>=0.2.9",
]

[project.urls]
Homepage = "https://github.com/MelForze/Redposture"
Repository = "https://github.com/MelForze/Redposture"
Issues = "https://github.com/MelForze/Redposture/issues"

[project.scripts]
redposture = "redposture_core.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.sdist]
include = [
  "/redposture_core",
  "/README.md",
  "/LICENSE",
  "/redposture.py",
]

[tool.hatch.build.targets.wheel]
packages = ["redposture_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["redposture_core", "redposture.py", "tests"]
show_error_codes = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
