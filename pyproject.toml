[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "redposture"
version = "5.10.0"
description = "Security toolkit for listener emulation, endpoint discovery/trigger/collect, and Redis/Postgres/MongoDB/Docker/Oracle/ClickHouse/etcd/Registry/Grafana/GitLab/Kafka/ZooKeeper/Elasticsearch/gRPC auditing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "RedPosture contributors" },
]
keywords = ["security", "cli", "redteam", "observability", "prometheus", "recon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = [
  "clickhouse-connect>=0.8.0",
  "clickhouse-driver>=0.2.9",
  "h2>=4.1.0",
  "grpcio-tools>=1.74.0,<1.81.0",
  "pymongo>=4.7,<5",
  "oracledb>=2.4,<4",
  "protobuf>=6.31.1,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/MelForze/Redposture"
Repository = "https://github.com/MelForze/Redposture"
Issues = "https://github.com/MelForze/Redposture/issues"

[project.scripts]
redposture = "redposture_core.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pre-commit>=3.5.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
  "/redposture_core",
  "/README.md",
  "/LICENSE",
  "/redposture.py",
]

[tool.hatch.build.targets.wheel]
packages = ["redposture_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "cli_param_fuzz: opt-in deterministic fuzz coverage for CLI parameter handling",
]

[tool.mypy]
python_version = "3.10"
files = ["redposture_core", "redposture.py", "tests"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
exclude = ["redposture_core/proto/"]
show_error_codes = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Third-party libraries that ship without type stubs. Treat their imports as
# `Any` (the existing behaviour) instead of failing the run with `import-untyped`,
# which otherwise halts mypy before it can check the rest of the tree.
[[tool.mypy.overrides]]
module = [
    "oracledb.*",
    "pymongo.*",
    "bson.*",
    "clickhouse_connect.*",
    "clickhouse_driver.*",
    "grpc.*",
    "grpc_tools.*",
    "google.protobuf.*",
]
ignore_missing_imports = true

# Tests are type-checked (no blanket ignore) for real defects: undefined names,
# bad imports, missing annotations, return-value mistakes, redefinitions. Only the
# error codes that exclusively flag the intentional gap between deliberately-minimal
# duck-typed doubles (fake consoles/streams/sockets, argparse-internals
# introspection) and the concrete types they stand in for are relaxed here.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "call-overload",
    "func-returns-value",
    "index",
    "list-item",
    "operator",
    "union-attr",
    "var-annotated",
]

# Generated protobuf/gRPC stubs (no py.typed); treat as untyped so attribute
# access on them is `Any` rather than a stream of attr-defined errors.
[[tool.mypy.overrides]]
module = ["redposture_core.proto.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["redposture_core/proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
per-file-ignores = { "redposture_core/proto/*_pb2.py" = ["I001", "UP009"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Coverage is collected via tox/CI or `pytest --cov=redposture_core
# --cov-report=term-missing`. `addopts` deliberately omits `--cov` so plain
# `pytest` works without pytest-cov installed; the `fail_under` floor below only
# applies when coverage is actually collected.
[tool.coverage.run]
source = ["redposture_core"]
branch = true
omit = ["redposture_core/proto/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor set a few points below the current ~79% so it catches a real regression
# without flapping on small branch-coverage drift. Ratchet up as coverage grows.
fail_under = 85
