name: Advanced quality

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read

jobs:
  cli-fuzz:
    name: CLI parameter fuzz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-py312.txt
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/ci-py312.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Deterministic CLI fuzz
        run: bash scripts/run_cli_param_fuzz.sh

  free-threaded-smoke:
    name: Free-threaded Python 3.13t
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup free-threaded Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13t"
      - name: Install smoke dependencies
        run: |
          python -m pip install pytest pytest-socket hatchling
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify free-threaded runtime and concurrency contracts
        run: |
          python -c 'import sysconfig; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1'
          python -m pytest -q \
            tests/test_scheduler.py \
            tests/test_lifecycle_state_machine.py \
            tests/test_mutating_retry_safety.py
