name: Release Smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-pipx-smoke:
    name: Build + pipx smoke (py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pipx

      - name: Build distributions
        run: python -m build

      - name: pipx install wheel
        run: pipx install dist/*.whl

      - name: CLI smoke
        run: |
          redposture --version
          redposture --help > /dev/null
          redposture registry -h > /dev/null
          if redposture db -h > /dev/null 2>&1; then
            echo "db command must be unavailable in v4"
            exit 1
          fi
