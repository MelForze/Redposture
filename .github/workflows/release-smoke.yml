name: Release Smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-pipx-smoke:
    name: Build + pipx smoke (py3.12)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/release-py312.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade --requirement requirements/release-py312.txt

      - name: Build distributions
        run: python -m build --no-isolation

      - name: pipx install wheel
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release-py312.txt
        run: pipx install dist/*.whl

      - name: CLI smoke
        run: |
          redposture --version
          redposture --help > /dev/null
          redposture registry -h > /dev/null
