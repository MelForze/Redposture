name: Publish RedPosture to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate package
    if: github.repository == 'MelForze/Redposture'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected_tag = f"v{project['version']}"
          actual_tag = os.environ['RELEASE_TAG']
          if actual_tag != expected_tag:
              raise SystemExit(f'Tag {actual_tag!r} does not match project version {expected_tag!r}')
          if project['name'].lower() != 'redposture':
              raise SystemExit(f"Unexpected project name: {project['name']!r}")
          print(f"Validated {project['name']} {project['version']}")
          PY

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed CLI entry point
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          from redposture_core.cli import main
          assert callable(main)
          print('CLI entry point imports successfully')
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    if: github.repository == 'MelForze/Redposture'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/redposture
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
