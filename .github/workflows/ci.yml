name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-py312.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --requirement requirements/ci-py312.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint and static checks
        run: bash scripts/run_ci_job.sh lint

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            lock-file: requirements/ci-py310.txt
          - python-version: "3.11"
            lock-file: requirements/ci-py311.txt
          - python-version: "3.12"
            lock-file: requirements/ci-py312.txt
          - python-version: "3.13"
            lock-file: requirements/ci-py313.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ${{ matrix.lock-file }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --requirement "${{ matrix.lock-file }}"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Tests and coverage
        run: bash scripts/run_ci_job.sh test
