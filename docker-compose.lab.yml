        CREATE DATABASE IF NOT EXISTS analytics;
        CREATE DATABASE IF NOT EXISTS iam;

        DROP TABLE IF EXISTS observability.events SYNC;
        DROP TABLE IF EXISTS observability.metric_samples SYNC;
        DROP TABLE IF EXISTS analytics.sessions SYNC;
        DROP TABLE IF EXISTS analytics.orders SYNC;
        DROP TABLE IF EXISTS iam.api_clients SYNC;

        CREATE TABLE IF NOT EXISTS observability.events
        (
            ts DateTime64(3),
            cluster LowCardinality(String),
            env LowCardinality(String),
            service LowCardinality(String),
            level LowCardinality(String),
            trace_id UUID,
            request_id String,
            method LowCardinality(String),
            route String,
            status_code UInt16,
            latency_ms UInt32,
            client_ip String,
            user_agent String,
            upstream String,
            message String,
            attrs Map(String, String)
        )
        ENGINE = MergeTree
        PARTITION BY toDate(ts)
        ORDER BY (service, ts, trace_id);

        CREATE TABLE IF NOT EXISTS observability.metric_samples
        (
            ts DateTime,
            metric_name LowCardinality(String),
            labels Map(String, String),
            value Float64
