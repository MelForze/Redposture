services:
  redis:
    image: redis:7-alpine
    container_name: redposture-lab-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  redis-seed:
    image: redis:7-alpine
    container_name: redposture-lab-redis-seed
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        redis-cli -h redis -a redis < /seed/seed.redis >/dev/null
        echo "[redis-seed] done"
    volumes:
      - ./docker/redis/seed.redis:/seed/seed.redis:ro

  postgres:
    image: postgres:16-alpine
    container_name: redposture-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  zookeeper:
    image: zookeeper:3.9
    container_name: redposture-lab-zookeeper
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,conf"
      ZOO_AUTOPURGE_PURGEINTERVAL: "1"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/2181'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  zookeeper-seed:
    image: zookeeper:3.9
    container_name: redposture-lab-zookeeper-seed
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: on-failure
    command:
      - bash
      - -ceu
      - |
        if command -v zkCli.sh >/dev/null 2>&1; then
          ZKCLI="zkCli.sh"
        else
          ZKCLI="$(echo /apache-zookeeper-*/bin/zkCli.sh)"
        fi

        cat >/tmp/seed_create.zk <<'EOF'
        create /redposture "env=lab,owner=platform"
        create /redposture/env "lab"
        create /redposture/app "service=redposture-api,namespace=observability"
        create /redposture/app/api_key "rp-zk-key-2026"
        create /redposture/app/jwt_secret "rp-jwt-lab-2026"
        create /redposture/app/oidc_client_secret "oidc-client-secret-lab"
        create /redposture/db "engine=postgres,host=postgres,port=5432"
        create /redposture/db/password "postgres"
        create /redposture/cache "backend=redis,host=redis,port=6379"
        create /redposture/cache/redis_uri "redis://default:redis@redis:6379/0"
        create /brokers "cluster=kafka-open"
        create /brokers/ids "source=seed"
        create /brokers/ids/1 "host=kafka-open,port=9092"
        create /config "profile=lab,reload_interval=30s"
        create /config/services "count=4"
        create /config/services/redposture "mode=lab,metrics=true"
        create /config/services/grafana "url=http://grafana:3000,admin_user=admin,admin_password=admin"
        create /config/services/postgres "dsn=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
        create /config/services/kafka "open=kafka-open:9092,auth=kafka-auth:9092,sasl_user=metrics,sasl_password=metricspass"
        create /observability "stack=prometheus-grafana,team=sre"
        create /observability/scrape_interval "15s"
        create /observability/remote_write_url "https://prom_rw:PromRW-2026@prometheus.internal/api/v1/write"
        quit
        EOF
        "$${ZKCLI}" -server zookeeper:2181 < /tmp/seed_create.zk >/tmp/seed_create.log 2>&1 || true

        cat >/tmp/seed_update.zk <<'EOF'
        set /redposture "env=lab,owner=platform"
        set /redposture/env "lab"
        set /redposture/app "service=redposture-api,namespace=observability"
        set /redposture/app/api_key "rp-zk-key-2026"
        set /redposture/app/jwt_secret "rp-jwt-lab-2026"
        set /redposture/app/oidc_client_secret "oidc-client-secret-lab"
        set /redposture/db "engine=postgres,host=postgres,port=5432"
        set /redposture/db/password "postgres"
        set /redposture/cache "backend=redis,host=redis,port=6379"
        set /redposture/cache/redis_uri "redis://default:redis@redis:6379/0"
        set /brokers "cluster=kafka-open"
        set /brokers/ids "source=seed"
        set /brokers/ids/1 "host=kafka-open,port=9092"
        set /config "profile=lab,reload_interval=30s"
        set /config/services "count=4"
        set /config/services/redposture "mode=lab,metrics=true"
        set /config/services/grafana "url=http://grafana:3000,admin_user=admin,admin_password=admin"
        set /config/services/postgres "dsn=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
        set /config/services/kafka "open=kafka-open:9092,auth=kafka-auth:9092,sasl_user=metrics,sasl_password=metricspass"
        set /observability "stack=prometheus-grafana,team=sre"
        set /observability/scrape_interval "15s"
        set /observability/remote_write_url "https://prom_rw:PromRW-2026@prometheus.internal/api/v1/write"
        quit
        EOF
        "$${ZKCLI}" -server zookeeper:2181 < /tmp/seed_update.zk >/tmp/seed_update.log 2>&1 || true
        echo "[zookeeper-seed] done"

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: redposture-lab-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd-open
      - --data-dir=/etcd-data
      - --enable-v2=true
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-open=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - etcd-open-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 6s
    restart: unless-stopped

  etcd-seed:
    image: curlimages/curl:8.12.1
    container_name: redposture-lab-etcd-seed
    depends_on:
      etcd:
        condition: service_healthy
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        put_v2() {
          path="$1"
          value="$2"
          curl -sS -X PUT "http://etcd:2379/v2/keys$${path}" -d "value=$${value}" >/dev/null
        }
        put_v3() {
          path="$1"
          value="$2"
          key_b64=$(printf '%s' "$${path}" | base64 | tr -d '\n')
          value_b64=$(printf '%s' "$${value}" | base64 | tr -d '\n')
          curl -sS -X POST "http://etcd:2379/v3/kv/put" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"$${key_b64}\",\"value\":\"$${value_b64}\"}" >/dev/null
        }

        put_v2 /redposture/env lab
        put_v2 /redposture/app/api_key rp-demo-key-2026
        put_v2 /redposture/db/password postgres
        put_v2 /redposture/db/readonly_password readonly
        put_v2 /redposture/cache/redis_uri redis://default:redis@redis:6379/0
        put_v2 /redposture/integrations/slack/webhook https://hooks.slack.com/services/T000/B000/REDACTED
        put_v2 /redposture/integrations/pagerduty/routing_key pd_demo_routing_key_2026
        put_v2 /redposture/feature_flags/new_ui true
        put_v2 /inventory/services/grafana/url http://grafana:3000
        put_v2 /inventory/services/prometheus/url http://prometheus:9090
        put_v2 /inventory/services/kafka/bootstrap kafka-open:9092

        put_v3 /redposture/v3/env lab
        put_v3 /redposture/v3/token rp-v3-token-2026
        put_v3 /redposture/v3/datasource/admin_user admin
        put_v3 /redposture/v3/datasource/admin_password admin
        put_v3 /redposture/v3/datasource/postgres_dsn postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
        put_v3 /redposture/v3/kafka/sasl_username metrics_collector
        put_v3 /redposture/v3/kafka/sasl_password Kfka-M0nitor-2026
        put_v3 /redposture/v3/observability/remote_write https://prom_rw:PromRW-2026@prometheus.internal/api/v1/write
        echo "[etcd-seed] done"

  etcd-auth:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: redposture-lab-etcd-auth
    command:
      - /usr/local/bin/etcd
      - --name=etcd-auth
      - --data-dir=/etcd-data
      - --enable-v2=true
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-auth:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-auth:2380
      - --initial-cluster=etcd-auth=http://etcd-auth:2380
      - --initial-cluster-state=new
    ports:
      - "22379:2379"
    volumes:
      - etcd-auth-data:/etcd-data
    restart: unless-stopped

  etcd-auth-seed:
    image: curlimages/curl:8.12.1
    container_name: redposture-lab-etcd-auth-seed
    depends_on:
      - etcd-auth
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        until curl -fsS "http://etcd-auth:2379/health" | grep -q '"health":"true"'; do
          sleep 1
        done
        if curl -sS -X POST "http://etcd-auth:2379/v3/auth/status" -H "Content-Type: application/json" -d '{}' | grep -q '"enabled":true'; then
          echo "[etcd-auth-seed] auth already configured"
          exit 0
        fi
        curl -sS -X PUT "http://etcd-auth:2379/v2/keys/secure/bootstrap" -d "value=1" >/dev/null || true
        curl -sS -X PUT "http://etcd-auth:2379/v2/keys/secure/proxmox/token" -d "value=pve-redposture-token-2026" >/dev/null || true
        curl -sS -X POST "http://etcd-auth:2379/v3/kv/put" \
          -H "Content-Type: application/json" \
          -d '{"key":"L3NlY3VyZS92My9ib290c3RyYXA=","value":"MQ=="}' >/dev/null || true
        curl -sS -X POST "http://etcd-auth:2379/v3/kv/put" \
          -H "Content-Type: application/json" \
          -d '{"key":"L3NlY3VyZS92My9rYWZrYS9zYXNsX3Bhc3N3b3Jk","value":"bWV0cmljc3Bhc3M="}' >/dev/null || true
        curl -sS -X POST "http://etcd-auth:2379/v3/auth/role/add" \
          -H "Content-Type: application/json" \
          -d '{"name":"root"}' >/dev/null || true
        curl -sS -X POST "http://etcd-auth:2379/v3/auth/user/add" \
          -H "Content-Type: application/json" \
          -d '{"name":"root","password":"rootpass"}' >/dev/null || true
        curl -sS -X POST "http://etcd-auth:2379/v3/auth/user/grant" \
          -H "Content-Type: application/json" \
          -d '{"user":"root","role":"root"}' >/dev/null || true
        curl -sS -X POST "http://etcd-auth:2379/v3/auth/enable" \
          -H "Content-Type: application/json" \
          -d '{}' >/dev/null || true
        echo "[etcd-auth-seed] done"

  kubeapi:
    image: rancher/k3s:v1.31.6-k3s1
    container_name: redposture-lab-kubeapi
    privileged: true
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --disable=metrics-server
      - --write-kubeconfig=/output/kubeconfig.yaml
      - --write-kubeconfig-mode=644
      - --tls-san=127.0.0.1
      - --tls-san=host.docker.internal
      - --tls-san=kubeapi
    tmpfs:
      - /run
      - /var/run
    ports:
      - "16443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./docker/kubeapi/output:/output
    healthcheck:
      test: ["CMD-SHELL", "kubectl get --raw=/readyz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kubeapi-seed:
    image: rancher/k3s:v1.31.6-k3s1
    container_name: redposture-lab-kubeapi-seed
    depends_on:
      kubeapi:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    volumes:
      - ./docker/kubeapi/seed.sh:/seed/seed.sh:ro
      - ./docker/kubeapi/manifests.yaml:/seed/manifests.yaml:ro
      - ./docker/kubeapi/output:/output
    restart: on-failure

  kubeapi-open:
    image: nginx:1.27-alpine
    container_name: redposture-lab-kubeapi-open
    depends_on:
      kubeapi:
        condition: service_healthy
      kubeapi-seed:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/proxy/start.sh"]
    ports:
      - "26443:26443"
    volumes:
      - ./docker/kubeapi/open_proxy/start.sh:/proxy/start.sh:ro
      - ./docker/kubeapi/open_proxy/nginx.conf.template:/proxy/nginx.conf.template:ro
      - ./docker/kubeapi/output:/tokens:ro
      - ./docker/kubeapi/open_mock/cert.pem:/certs/cert.pem:ro
      - ./docker/kubeapi/open_mock/key.pem:/certs/key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:26443/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  kafka-open:
    image: confluentinc/cp-kafka:7.6.1
    container_name: redposture-lab-kafka-open
    environment:
      CLUSTER_ID: "LxzRBSyNT_-nGe7wyn5kSw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-open:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-open:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-open-seed:
    image: confluentinc/cp-kafka:7.6.1
    container_name: redposture-lab-kafka-open-seed
    depends_on:
      kafka-open:
        condition: service_healthy
    restart: on-failure
    command:
      - bash
      - -ceu
      - |
        kafka-topics --bootstrap-server kafka-open:9092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka-open:9092 --create --if-not-exists --topic payments.events --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka-open:9092 --create --if-not-exists --topic audit.logs --partitions 1 --replication-factor 1
        open_orders_count=$(kafka-run-class kafka.tools.GetOffsetShell --bootstrap-server kafka-open:9092 --topic orders 2>/dev/null | awk -F: '{sum += $$3} END {print sum+0}')
        [ -n "$${open_orders_count}" ] || open_orders_count=0
        if [ "$${open_orders_count}" -eq 0 ]; then
          cat <<'EOF' | kafka-console-producer --bootstrap-server kafka-open:9092 --topic orders >/dev/null
        {"order_id":"ord-1001","status":"created","amount":99.50}
        {"order_id":"ord-1002","status":"paid","amount":149.00}
        {"order_id":"ord-1003","status":"refunded","amount":49.00}
        EOF
        fi
        open_payments_count=$(kafka-run-class kafka.tools.GetOffsetShell --bootstrap-server kafka-open:9092 --topic payments.events 2>/dev/null | awk -F: '{sum += $$3} END {print sum+0}')
        [ -n "$${open_payments_count}" ] || open_payments_count=0
        if [ "$${open_payments_count}" -eq 0 ]; then
          cat <<'EOF' | kafka-console-producer --bootstrap-server kafka-open:9092 --topic payments.events >/dev/null
        {"payment_id":"pay-3001","provider":"stripe","status":"authorized","amount":149.00}
        {"payment_id":"pay-3002","provider":"adyen","status":"captured","amount":99.50}
        {"payment_id":"pay-3003","provider":"stripe","status":"failed","reason":"insufficient_funds"}
        EOF
        fi
        open_audit_count=$(kafka-run-class kafka.tools.GetOffsetShell --bootstrap-server kafka-open:9092 --topic audit.logs 2>/dev/null | awk -F: '{sum += $$3} END {print sum+0}')
        [ -n "$${open_audit_count}" ] || open_audit_count=0
        if [ "$${open_audit_count}" -eq 0 ]; then
          cat <<'EOF' | kafka-console-producer --bootstrap-server kafka-open:9092 --topic audit.logs >/dev/null
        {"event":"login","user":"admin","source_ip":"10.0.1.11"}
        {"event":"token_created","service":"grafana","token_hint":"gfa_demo_token_123"}
        {"event":"config_changed","user":"automation","path":"/etc/redposture/app.yml"}
        EOF
        fi
        echo "[kafka-open-seed] done"

  kafka-auth:
    image: confluentinc/cp-kafka:7.6.1
    container_name: redposture-lab-kafka-auth
    entrypoint:
      - /bin/bash
      - -ceu
      - |
        cat >/tmp/kafka_server_jaas.conf <<'EOF'
        KafkaServer {
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="broker"
          password="brokerpass"
          user_broker="brokerpass"
          user_metrics="metricspass";
        };
        sasl_plaintext.KafkaServer {
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="broker"
          password="brokerpass"
          user_broker="brokerpass"
          user_metrics="metricspass";
        };
        EOF
        export KAFKA_OPTS="-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"
        exec /etc/confluent/docker/run
    environment:
      CLUSTER_ID: "apWLAYJORsehwZoyfyaUtQ"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "SASL_PLAINTEXT://kafka-auth:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "SASL_PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-auth:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="brokerpass" user_broker="brokerpass" user_metrics="metricspass";'
    ports:
      - "29092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-auth-seed:
    image: confluentinc/cp-kafka:7.6.1
    container_name: redposture-lab-kafka-auth-seed
    depends_on:
      kafka-auth:
        condition: service_healthy
    restart: on-failure
    command:
      - bash
      - -ceu
      - |
        cat >/tmp/client.properties <<'EOF'
        security.protocol=SASL_PLAINTEXT
        sasl.mechanism=PLAIN
        sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="metrics" password="metricspass";
        EOF
        for i in $(seq 1 30); do
          kafka-topics --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --list >/dev/null 2>&1 && break
          sleep 1
        done
        kafka-topics --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --create --if-not-exists --topic secure.orders --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --create --if-not-exists --topic secure.metrics --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --create --if-not-exists --topic secure.audit --partitions 1 --replication-factor 1
        auth_orders_count=$(kafka-run-class kafka.tools.GetOffsetShell --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --topic secure.orders 2>/dev/null | awk -F: '{sum += $$3} END {print sum+0}')
        [ -n "$${auth_orders_count}" ] || auth_orders_count=0
        if [ "$${auth_orders_count}" -eq 0 ]; then
          cat <<'EOF' | kafka-console-producer --bootstrap-server kafka-auth:9092 --producer.config /tmp/client.properties --topic secure.orders >/dev/null
        {"order_id":"sec-2001","status":"queued","tenant":"internal"}
        {"order_id":"sec-2002","status":"processed","tenant":"internal"}
        {"order_id":"sec-2003","status":"failed","tenant":"internal","reason":"card_declined"}
        EOF
        fi
        auth_metrics_count=$(kafka-run-class kafka.tools.GetOffsetShell --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --topic secure.metrics 2>/dev/null | awk -F: '{sum += $$3} END {print sum+0}')
        [ -n "$${auth_metrics_count}" ] || auth_metrics_count=0
        if [ "$${auth_metrics_count}" -eq 0 ]; then
          cat <<'EOF' | kafka-console-producer --bootstrap-server kafka-auth:9092 --producer.config /tmp/client.properties --topic secure.metrics >/dev/null
        {"metric":"lag","group":"metrics_collector","value":12}
        {"metric":"consumer_errors","group":"metrics_collector","value":1}
        EOF
        fi
        auth_audit_count=$(kafka-run-class kafka.tools.GetOffsetShell --bootstrap-server kafka-auth:9092 --command-config /tmp/client.properties --topic secure.audit 2>/dev/null | awk -F: '{sum += $$3} END {print sum+0}')
        [ -n "$${auth_audit_count}" ] || auth_audit_count=0
        if [ "$${auth_audit_count}" -eq 0 ]; then
          cat <<'EOF' | kafka-console-producer --bootstrap-server kafka-auth:9092 --producer.config /tmp/client.properties --topic secure.audit >/dev/null
        {"event":"sasl_login","user":"metrics","source":"prometheus"}
        {"event":"topic_acl_update","actor":"broker","topic":"secure.orders"}
        EOF
        fi
        echo "[kafka-auth-seed] done"

  registry-open:
    image: registry:2
    container_name: redposture-lab-registry-open
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-open-data:/var/lib/registry
    ports:
      - "15000:5000"
    restart: unless-stopped

  registry-seed:
    image: python:3.12-alpine
    container_name: redposture-lab-registry-seed
    depends_on:
      registry-open:
        condition: service_started
    restart: on-failure
    command: ["python", "/seed/seed_registry.py"]
    volumes:
      - ./docker/registry/seed_registry.py:/seed/seed_registry.py:ro

  registry-auth:
    image: nginx:1.27-alpine
    container_name: redposture-lab-registry-auth
    depends_on:
      registry-open:
        condition: service_started
    ports:
      - "15001:5000"
    volumes:
      - ./docker/registry/nginx.registry-auth.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/registry/registry.htpasswd:/etc/nginx/conf.d/registry.htpasswd:ro
    restart: unless-stopped

  harbor-mock:
    image: python:3.12-alpine
    container_name: redposture-lab-harbor-mock
    command: ["python", "/app/harbor_mock.py"]
    volumes:
      - ./docker/registry/harbor_mock.py:/app/harbor_mock.py:ro
    ports:
      - "15002:8080"
    restart: unless-stopped

  gitlab-registry-mock:
    image: python:3.12-alpine
    container_name: redposture-lab-gitlab-registry-mock
    command: ["python", "/app/gitlab_registry_mock.py"]
    volumes:
      - ./docker/registry/gitlab_registry_mock.py:/app/gitlab_registry_mock.py:ro
    ports:
      - "15003:5000"
    restart: unless-stopped

  gitlab-web-mock:
    image: python:3.12-alpine
    container_name: redposture-lab-gitlab-web-mock
    command:
      - /bin/sh
      - -lc
      - apk add --no-cache git >/dev/null && python /app/gitlab_web_mock.py
    volumes:
      - ./docker/gitlab/gitlab_web_mock.py:/app/gitlab_web_mock.py:ro
    ports:
      - "18080:8080"
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:3.72.0
    container_name: redposture-lab-nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms768m -Xmx768m -XX:MaxDirectMemorySize=768m
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "15004:8081"
    restart: unless-stopped

  nexus-seed:
    image: python:3.12-slim
    container_name: redposture-lab-nexus-seed
    depends_on:
      nexus:
        condition: service_started
    environment:
      NEXUS_URL: "http://nexus:8081"
      NEXUS_ADMIN_PASSWORD: "NexusAdmin!2026"
      NEXUS_ADMIN_PASSWORD_FILE: "/nexus-data/admin.password"
    command: ["python", "/seed/seed_nexus.py"]
    volumes:
      - ./docker/nexus/seed_nexus.py:/seed/seed_nexus.py:ro
      - nexus-data:/nexus-data
    restart: on-failure

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: redposture-lab-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./docker/real_lab/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9115:9115"
    restart: unless-stopped

  kafka-exporter:
    image: python:3.12-alpine
    container_name: redposture-lab-kafka-exporter
    command: ["python", "/app/legacy_kafka_exporter.py"]
    volumes:
      - ./docker/real_lab/legacy_kafka_exporter.py:/app/legacy_kafka_exporter.py:ro
    ports:
      - "9308:9308"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redposture-lab-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "redis"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9121:9121"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: redposture-lab-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    command:
      - "--config.file=/etc/postgres_exporter/postgres_exporter.yml"
    volumes:
      - ./docker/real_lab/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres-exporter-proxy:
    image: python:3.12-alpine
    container_name: redposture-lab-postgres-exporter-proxy
    command: ["python", "/app/postgres_exporter_auth_proxy.py"]
    environment:
      BACKEND_BASE: "http://postgres-exporter:9187"
      DEFAULT_AUTH_MODULE: "lab"
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "9187"
    volumes:
      - ./docker/real_lab/postgres_exporter_auth_proxy.py:/app/postgres_exporter_auth_proxy.py:ro
    depends_on:
      postgres-exporter:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9187:9187"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: redposture-lab-node-exporter
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: redposture-lab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.17
    container_name: redposture-lab-consul
    command:
      - consul
      - agent
      - -dev
      - -client=0.0.0.0
      - -ui
      - -enable-script-checks=true
      - -enable-local-script-checks=true
    ports:
      - "8500:8500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "consul version >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  consul-seed:
    image: curlimages/curl:8.12.1
    container_name: redposture-lab-consul-seed
    depends_on:
      consul:
        condition: service_healthy
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        put_kv() {
          key="$1"
          value="$2"
          curl -fsS -X PUT "http://consul:8500/v1/kv/$${key}" --data-binary "$${value}" >/dev/null
        }
        reg_service() {
          payload="$1"
          curl -fsS -X PUT "http://consul:8500/v1/agent/service/register" \
            -H "Content-Type: application/json" \
            -d "$${payload}" >/dev/null
        }
        reg_check() {
          payload="$1"
          curl -fsS -X PUT "http://consul:8500/v1/agent/check/register" \
            -H "Content-Type: application/json" \
            -d "$${payload}" >/dev/null
        }

        put_kv "redposture/env" "lab"
        put_kv "redposture/postgres/dsn" "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
        put_kv "redposture/redis/uri" "redis://default:redis@redis:6379/0"
        put_kv "redposture/grafana/admin_password" "admin"
        put_kv "redposture/kafka/sasl_username" "metrics_collector"
        put_kv "redposture/kafka/sasl_password" "Kfka-M0nitor-2026"
        put_kv "inventory/services/grafana/url" "http://grafana:3000"
        put_kv "inventory/services/registry/url" "http://registry-open:5000"

        reg_service '{"ID":"svc-redposture-api","Name":"redposture-api","Address":"redposture-app.internal","Port":8080,"Tags":["prod","http","api"],"Meta":{"owner":"platform","env":"lab"},"Check":{"CheckID":"chk-redposture-api-http","Name":"redposture-api-http","HTTP":"http://redposture-app.internal:8080/healthz","Method":"GET","Interval":"15s","Timeout":"2s"}}'
        reg_service '{"ID":"svc-grafana","Name":"grafana","Address":"grafana","Port":3000,"Tags":["observability","ui"],"Meta":{"team":"sre","env":"lab"},"Check":{"CheckID":"chk-grafana-http","Name":"grafana-http","HTTP":"http://grafana:3000/api/health","Method":"GET","Interval":"20s","Timeout":"2s"}}'
        reg_service '{"ID":"svc-redis","Name":"redis","Address":"redis","Port":6379,"Tags":["cache","tcp"],"Meta":{"auth":"required"}}'
        reg_service '{"ID":"svc-postgres","Name":"postgres","Address":"postgres","Port":5432,"Tags":["database","tcp"],"Meta":{"auth":"required"}}'

        reg_check '{"ID":"chk-node-exporter-tcp","Name":"node-exporter-tcp","TCP":"node-exporter:9100","Interval":"30s","Timeout":"2s"}'
        reg_check '{"ID":"chk-blackbox-ttl","Name":"blackbox-exporter-ttl","TTL":"45s","Status":"passing","Notes":"seeded TTL check for health state enumeration"}'
        curl -fsS -X PUT "http://consul:8500/v1/agent/check/pass/chk-blackbox-ttl" >/dev/null || true
        echo "[consul-seed] done"

  consul-acl:
    image: hashicorp/consul:1.17
    container_name: redposture-lab-consul-acl
    command:
      - consul
      - agent
      - -dev
      - -client=0.0.0.0
      - -ui
      - -enable-script-checks=true
      - -enable-local-script-checks=true
      - -config-file=/consul/config/acl.hcl
    ports:
      - "18500:8500"
    volumes:
      - ./docker/consul/acl.hcl:/consul/config/acl.hcl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "consul info >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  consul-acl-seed:
    image: python:3.12-alpine
    container_name: redposture-lab-consul-acl-seed
    depends_on:
      consul-acl:
        condition: service_started
    environment:
      CONSUL_HTTP_ADDR: "http://consul-acl:8500"
      CONSUL_TOKENS_FILE: "/output/consul_acl_tokens.env"
    volumes:
      - ./docker/consul/seed_acl.py:/seed/seed_acl.py:ro
      - ./docker/consul/output:/output
    command: ["python", "/seed/seed_acl.py"]
    restart: on-failure

  gitlab:
    image: gitlab/gitlab-ce:17.8.1-ce.0
    container_name: redposture-lab-gitlab
    profiles: ["gitlab-real"]
    # Official GitLab CE Omnibus image is amd64-oriented. On arm64 hosts it may
    # run under emulation (QEMU) and can crash during omnibus init.
    platform: linux/amd64
    hostname: gitlab
    shm_size: "256m"
    environment:
      GITLAB_ROOT_PASSWORD: "redpostureRoot!2026"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:80'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        letsencrypt['enable'] = false
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        grafana['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        registry['enable'] = false
        pages_external_url ''
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      - "18081:80"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/-/readiness >/dev/null || curl -fsS http://127.0.0.1/users/sign_in >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 180s
    restart: unless-stopped

  gitlab-seed:
    image: gitlab/gitlab-ce:17.8.1-ce.0
    container_name: redposture-lab-gitlab-seed
    profiles: ["gitlab-real"]
    platform: linux/amd64
    depends_on:
      gitlab:
        condition: service_started
    environment:
      GITLAB_URL: "http://gitlab:80"
      GITLAB_ROOT_PASSWORD: "redpostureRoot!2026"
      GITLAB_ROOT_PAT: "glpat-redposture-lab-root-2026"
      GITLAB_ANALYST_PAT: "glpat-redposture-lab-analyst-2026"
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    volumes:
      - ./docker/gitlab/seed.sh:/seed/seed.sh:ro
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    restart: on-failure

  proxmox-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: redposture-lab-proxmox-exporter
    command:
      - "--config.file=/etc/prometheus/pve.yml"
      - "--web.listen-address=:9221"
    volumes:
      - ./docker/real_lab/pve.yml:/etc/prometheus/pve.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9221:9221"
    restart: unless-stopped

  exporter-lab:
    build:
      context: .
      dockerfile: docker/exporter_lab/Dockerfile
    container_name: redposture-lab-exporter-lab
    environment:
      CALLBACK_TIMEOUT: "2.0"
      BLACKBOX_CALLBACK_USER: "blackbox"
      BLACKBOX_CALLBACK_PASSWORD: "blackbox"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Additional exporters on their standard ports.
      - "9116:9116"
      - "9127:9127"
      - "9216:9216"
      - "9256:9256"
      - "9342:9342"
      - "9349:9349"
      - "9427:9427"
      # Synthetic callback-friendly mirrors on high ports to avoid conflicts
      # with real exporter containers above.
      - "19100:9100"
      - "19115:9115"
      - "19121:9121"
      - "19187:9187"
      - "19221:9221"
      - "19308:9308"
    restart: unless-stopped

volumes:
  etcd-open-data:
  etcd-auth-data:
  k3s-data:
  registry-open-data:
  nexus-data:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
