        reg_service '{"ID":"svc-redis","Name":"redis","Address":"redis","Port":6379,"Tags":["cache","tcp"],"Meta":{"auth":"required"}}'
        reg_service '{"ID":"svc-postgres","Name":"postgres","Address":"postgres","Port":5432,"Tags":["database","tcp"],"Meta":{"auth":"required"}}'
        reg_service '{"ID":"svc-consul-ui","Name":"consul","Address":"consul","Port":8500,"Tags":["ui","control-plane"],"Meta":{"component":"consul","env":"lab"},"Check":{"CheckID":"chk-consul-http","Name":"consul-http","HTTP":"http://consul:8500/v1/status/leader","Method":"GET","Interval":"20s","Timeout":"2s"}}'
        reg_service '{"ID":"svc-registry-open","Name":"registry","Address":"registry-open","Port":5000,"Tags":["registry","docker","open"],"Meta":{"auth":"anonymous"}}'
        reg_service '{"ID":"svc-nexus","Name":"nexus","Address":"nexus","Port":8081,"Tags":["registry","artifact","nexus"],"Meta":{"role":"artifact"}}'
        reg_service '{"ID":"svc-kubeapi","Name":"kubeapi","Address":"kubeapi","Port":6443,"Tags":["kubernetes","api","tls"],"Meta":{"auth":"required"}}'
        reg_service '{"ID":"svc-kubeapi-open","Name":"kubeapi-open","Address":"kubeapi-open","Port":26443,"Tags":["kubernetes","api","proxy","anonymous"],"Meta":{"auth":"anonymous"}}'
        reg_service '{"ID":"svc-gitlab-web-mock","Name":"gitlab","Address":"gitlab-web-mock","Port":8080,"Tags":["gitlab","web","mock"],"Meta":{"env":"lab"}}'
        reg_service '{"ID":"svc-harbor-mock","Name":"harbor","Address":"harbor-mock","Port":8080,"Tags":["registry","harbor","mock"],"Meta":{"env":"lab"}}'

        reg_check '{"ID":"chk-node-exporter-tcp","Name":"node-exporter-tcp","TCP":"node-exporter:9100","Interval":"30s","Timeout":"2s"}'
        reg_check '{"ID":"chk-blackbox-ttl","Name":"blackbox-exporter-ttl","TTL":"45s","Status":"passing","Notes":"seeded TTL check for health state enumeration"}'
