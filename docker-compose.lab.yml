        catalog_reg '{"Datacenter":"dc1","Node":"obs-1","Address":"10.20.20.21","NodeMeta":{"az":"use1a","role":"observability","os":"linux"},"Service":{"ID":"obs-1-prometheus","Service":"prometheus","Address":"10.20.20.21","Port":9090,"Tags":["metrics","prometheus"],"Meta":{"retention":"15d"}},"Check":{"Node":"obs-1","CheckID":"service:obs-1-prometheus","Name":"prometheus:9090","Status":"passing","ServiceID":"obs-1-prometheus"}}'
