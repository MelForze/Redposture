services:
  redis:
    image: redis:7-alpine
    container_name: redposture-lab-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  redis-seed:
    image: redis:7-alpine
    container_name: redposture-lab-redis-seed
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        redis-cli -h redis -a redis < /seed/seed.redis >/dev/null
        echo "[redis-seed] done"
    volumes:
      - ./docker/redis/seed.redis:/seed/seed.redis:ro

  postgres:
    image: postgres:16-alpine
    container_name: redposture-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  clickhouse-open:
    image: clickhouse/clickhouse-server:24.8
    container_name: redposture-lab-clickhouse-open
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: default
    volumes:
      - ./docker/clickhouse/user_scripts/redposture_exec.sh:/var/lib/clickhouse/user_scripts/redposture_exec.sh:ro
    ports:
      - "9000:9000"
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --port 9000 --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  clickhouse-open-seed:
    image: clickhouse/clickhouse-server:24.8
    container_name: redposture-lab-clickhouse-open-seed
    depends_on:
      clickhouse-open:
        condition: service_healthy
    network_mode: "service:clickhouse-open"
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        cat >/tmp/open_seed.sql <<'SQL'
