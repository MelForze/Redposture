      - agent
      - -dev
      - -client=0.0.0.0
      - -ui
      - -enable-script-checks=true
      - -enable-local-script-checks=true
    ports:
      - "8500:8500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "consul version >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  consul-seed:
    image: curlimages/curl:8.12.1
    container_name: redposture-lab-consul-seed
    depends_on:
      consul:
        condition: service_healthy
    restart: on-failure
    command:
      - sh
      - -ceu
      - |
        put_kv() {
          key="$1"
          value="$2"
          curl -fsS -X PUT "http://consul:8500/v1/kv/$${key}" --data-binary "$${value}" >/dev/null
        }
        reg_service() {
          payload="$1"
          curl -fsS -X PUT "http://consul:8500/v1/agent/service/register" \
            -H "Content-Type: application/json" \
            -d "$${payload}" >/dev/null
        }
        reg_check() {
          payload="$1"
          curl -fsS -X PUT "http://consul:8500/v1/agent/check/register" \
            -H "Content-Type: application/json" \
            -d "$${payload}" >/dev/null
        }
        catalog_reg() {
          payload="$1"
          curl -fsS -X PUT "http://consul:8500/v1/catalog/register" \
            -H "Content-Type: application/json" \
            -d "$${payload}" >/dev/null
        }

