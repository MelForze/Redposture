services:
  zookeeper-auth:
    image: zookeeper:3.9.5
    container_name: redposture-lab-zookeeper-auth
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,conf"
      ZOO_AUTOPURGE_PURGEINTERVAL: "1"
    ports:
      - "22185:2181"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/2181'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  zookeeper-auth-seed:
    image: zookeeper:3.9.5
    container_name: redposture-lab-zookeeper-auth-seed
    depends_on:
      zookeeper-auth:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/redposture-zookeeper-auth-seed-ready"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 1s
    command:
      - bash
      - -ceu
      - |
        if command -v zkCli.sh >/dev/null 2>&1; then
          ZKCLI="zkCli.sh"
        else
          ZKCLI="$(echo /apache-zookeeper-*/bin/zkCli.sh)"
        fi

        cat >/tmp/seed_auth.zk <<'EOF'
        addauth digest zk:zookeeper
        create /redposture-auth "digest-acl-late-default-hit"
        setAcl /redposture-auth auth::cdrwa
        setAcl / auth::cdrwa
        getAcl /
        get /redposture-auth
        quit
        EOF

        for attempt in $$(seq 1 20); do
          "$${ZKCLI}" -server zookeeper-auth:2181 < /tmp/seed_auth.zk > /tmp/seed_auth.log 2>&1 || true
          if grep -q 'digest-acl-late-default-hit' /tmp/seed_auth.log \
            && grep -q "digest,'zk:" /tmp/seed_auth.log; then
            echo "[zookeeper-auth-seed] protected root with digest ACL for zk:zookeeper"
            touch /tmp/redposture-zookeeper-auth-seed-ready
            tail -f /dev/null
          fi
          echo "[zookeeper-auth-seed] retry $${attempt}/20"
          sleep 1
        done
        cat /tmp/seed_auth.log >&2 || true
        exit 1
