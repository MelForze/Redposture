[tox]
envlist = py310,py311,py312,py313,lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run smoke checks and unit tests on a specific Python version
package = skip
deps =
    py310: -r requirements/ci-py310.txt
    py311: -r requirements/ci-py311.txt
    py312: -r requirements/ci-py312.txt
    py313: -r requirements/ci-py313.txt
allowlist_externals = bash
commands_pre = python -m pip install --no-deps --no-build-isolation -e .
commands =
    python --version
    bash scripts/run_ci_job.sh test

[testenv:lint]
description = Run static checks (single interpreter is enough)
basepython = python3.12
package = skip
deps =
    -r requirements/ci-py312.txt
allowlist_externals = bash
commands_pre = python -m pip install --no-deps --no-build-isolation -e .
commands =
    python --version
    bash scripts/run_ci_job.sh lint
