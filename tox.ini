[tox]
envlist = py310,py311,py312,py313,lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run smoke checks and unit tests on a specific Python version
deps =
    pytest>=8.3.0
commands =
    python --version
    python -m py_compile redposture.py
    python -m compileall -q redposture_core tests
    pytest -q

[testenv:lint]
description = Run static checks (single interpreter is enough)
deps =
    mypy>=1.11.0
    ruff>=0.6.0
    pytest>=8.3.0
commands =
    python --version
    ruff check .
    ruff format --check .
    mypy
    pytest -q tests/test_cli_args.py
